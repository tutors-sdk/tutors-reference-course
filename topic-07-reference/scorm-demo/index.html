<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCORM Demo: Standards Self-Check</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 2rem 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
        background: Canvas;
        color: CanvasText;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.4rem;
      }
      .banner {
        margin: 0 0 1.5rem;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        background: rgba(124, 92, 191, 0.12);
        border: 1px solid rgba(124, 92, 191, 0.4);
        font-size: 0.95rem;
      }
      .banner.warning {
        background: rgba(191, 140, 60, 0.12);
        border-color: rgba(191, 140, 60, 0.4);
      }
      .question {
        margin-bottom: 1.5rem;
      }
      .prompt {
        margin: 0 0 0.5rem;
        font-weight: 600;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .option {
        padding: 0.5rem 0.9rem;
        border: 1px solid currentColor;
        border-radius: 0.5rem;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .option:hover {
        background: rgba(128, 128, 128, 0.15);
      }
      .option.correct {
        border-color: #2f8f4e;
        background: rgba(47, 143, 78, 0.18);
      }
      .option.wrong {
        border-color: #b3453a;
        background: rgba(179, 69, 58, 0.18);
      }
      .summary {
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(128, 128, 128, 0.35);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <h1>Standards Self-Check</h1>
    <p id="banner" class="banner">Looking for the SCORM run-time…</p>
    <div id="sco"></div>
    <script src="sco.js"></script>
  </body>
</html>
